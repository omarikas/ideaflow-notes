<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ideaflow</title>
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="Your captured ideas.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ideaflow">
<style>
  :root{
    --bg:#0b0c10; --card:#15171e; --fg:#e8e9ed; --mut:#8b90a0;
    --acc:#7c6cff; --acc2:#22d3ee; --line:#262a35; --chip:#232734;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-text-size-adjust:100%}
  a{color:var(--acc2);text-decoration:none;word-break:break-word}
  header{position:sticky;top:0;z-index:5;background:rgba(11,12,16,.86);
    backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 14px 12px}
  .bar{display:flex;align-items:center;gap:10px;max-width:680px;margin:0 auto}
  .logo{font-weight:700;letter-spacing:-.02em;font-size:19px;white-space:nowrap}
  .logo b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .count{color:var(--mut);font-size:13px;margin-left:auto;white-space:nowrap}
  .tools{display:flex;gap:8px;max-width:680px;margin:12px auto 0}
  input[type=search]{flex:1;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:11px 13px;font-size:16px;outline:none;min-width:0}
  input[type=search]:focus{border-color:var(--acc)}
  button.icon{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:0 13px;font-size:16px;cursor:pointer}
  main{max-width:680px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 40px)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 15px;margin:0 0 12px}
  .card .text{white-space:pre-wrap;word-break:break-word;font-size:16.5px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;
    color:var(--mut);font-size:12.5px}
  .chip{background:var(--chip);border-radius:999px;padding:3px 9px;color:var(--mut)}
  .chip.proj{color:var(--acc);background:#241f3a}
  .chip.src{color:var(--acc2)}
  .empty,.status{color:var(--mut);text-align:center;padding:40px 10px}
  .offline{background:#3a2a12;color:#ffd79a}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">idea<b>flow</b></div>
    <div class="count" id="count"></div>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="search ideas…" autocomplete="off" enterkeyhint="search">
    <button class="icon" id="refresh" title="Refresh" aria-label="Refresh">↻</button>
  </div>
</header>
<main>
  <div id="banner" class="status hidden"></div>
  <div id="list"></div>
  <div id="empty" class="empty hidden">No ideas yet.</div>
</main>
<script src="./app.js"></script>
</body>
</html>
